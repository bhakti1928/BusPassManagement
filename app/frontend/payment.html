<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Pass Payment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="payment.css">
</head>

<body>

<div class="payment-card">

    <h2>Bus Pass Payment</h2>

    <div class="details">
    <p><strong>Student ID:</strong> <span id="student"></span></p>
    <p><strong>Pass Type:</strong> <span id="passType"></span></p>
    <p><strong>Route:</strong> <span id="route"></span></p>
    <p><strong>Amount:</strong> ₹<span id="amount"></span></p>
</div>
    <h5>Select Payment Method</h5>

    <div class="form-check">
        <input class="form-check-input" type="radio" name="payment" checked>
        <label>UPI</label>
    </div>

    <div class="form-check">
        <input class="form-check-input" type="radio" name="payment">
        <label>Debit / Credit Card</label>
    </div>

    <div class="form-check">
        <input class="form-check-input" type="radio" name="payment">
        <label>Net Banking</label>
    </div>

    <button class="btn btn-success mt-4 w-100" onclick="payNow()">
        Pay Now
    </button>

</div>

<script src="payment.js"></script>

</body>
</html>
