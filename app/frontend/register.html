<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="register.css">
</head>

<body>

    <header class="top-header">
    <div class="container d-flex justify-content-between align-items-center">
        <h3>🚌 Bus Pass Management System</h3>
        <span><i class="bi bi-person-circle"></i> Student Portal</span>
    </div>
</header>

<div class="register-card">

    <div class="logo">
        🚌
    </div>

    <h2>Bus Pass Management System</h2>

    <h4>Student Registration</h4>

    <p>Create your account</p>

    <div class="mb-3">
        <label>Name</label>
        <div class="input-group">
            <span class="input-group-text">
                <i class="bi bi-person-fill"></i>
            </span>
            <input type="text" id="name" class="form-control" placeholder="Enter Name">
        </div>
    </div>

    <div class="mb-3">
        <label>Email</label>
        <div class="input-group">
            <span class="input-group-text">
                <i class="bi bi-envelope-fill"></i>
            </span>
            <input type="email" id="email" class="form-control" placeholder="Enter Email">
        </div>
    </div>

    <div class="mb-3">
        <label>Mobile</label>
        <div class="input-group">
            <span class="input-group-text">
                <i class="bi bi-telephone-fill"></i>
            </span>
            <input type="text" id="mobile" class="form-control" placeholder="Enter Mobile Number">
        </div>
    </div>

    <div class="mb-3">
        <label>College</label>
        <div class="input-group">
            <span class="input-group-text">
                <i class="bi bi-mortarboard-fill"></i>
            </span>
            <input type="text" id="college" class="form-control" placeholder="Enter College Name">
        </div>
    </div>

    <div class="mb-4">
        <label>Password</label>
        <div class="input-group">
            <span class="input-group-text">
                <i class="bi bi-lock-fill"></i>
            </span>
            <input type="password" id="password" class="form-control" placeholder="Enter Password">
        </div>
    </div>

    <button class="btn btn-primary w-100 register-btn"
        onclick="registerStudent()">
        <i class="bi bi-person-plus-fill"></i>
        Register
    </button>

    <button class="btn btn-outline-light w-100 mt-3"
    onclick="window.location.href='login.html'">
        <i class="bi bi-arrow-left"></i>
        Back to Login
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
