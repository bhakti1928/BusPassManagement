<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Bus Pass</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="apply.css">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">

   <div class="card p-4" style="max-width:500px; width:100%;">

        <h2 class="text-center fw-bold mb-4">
            🚌 Apply Bus Pass
        </h2>

        <div class="mb-3">
            <label class="form-label">Student ID</label>
            <input type="number" id="student_id" class="form-control" placeholder="Enter Student ID">
        </div>

        <div class="mb-3">
            <label class="form-label">Source</label>
            <input type="text" id="source" class="form-control" placeholder="Enter Source">
        </div>

        <div class="mb-3">
            <label class="form-label">Destination</label>
            <input type="text" id="destination" class="form-control" placeholder="Enter Destination">
        </div>

        <div class="mb-3">
            <label class="form-label">Pass Type</label>
            <select id="pass_type" class="form-select">
                <option value="Monthly">Monthly</option>
                <option value="Quarterly">Quarterly</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Start Date</label>
            <input type="date" id="start_date" class="form-control">
        </div>

        <div class="mb-4">
            <label class="form-label">End Date</label>
            <input type="date" id="end_date" class="form-control">
        </div>

        <button class="btn btn-primary w-100 mb-3" onclick="applyBusPass()">
            Apply Bus Pass
        </button>

       <button class="btn btn-outline-light w-100" onclick="logout()">
            Logout
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
