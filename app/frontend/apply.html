<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply Bus Pass</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="apply.css">
</head>

<body>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-6">

                <div class="card shadow-lg p-4">

                    <h2 class="text-center fw-bold mb-4">
                        🚌 Apply Bus Pass
                    </h2>


                    <!-- Student ID -->
                    <div class="mb-3">
                        <label class="form-label">
                            Student ID
                        </label>

                        <input
                            type="number"
                            id="student_id"
                            class="form-control"
                            readonly
                        >
                    </div>


                    <!-- Source -->
                    <div class="mb-3">
                        <label class="form-label">
                            Source
                        </label>

                        <input
                            type="text"
                            id="source"
                            class="form-control"
                            placeholder="Enter Source"
                            required
                        >
                    </div>


                    <!-- Destination -->
                    <div class="mb-3">
                        <label class="form-label">
                            Destination
                        </label>

                        <input
                            type="text"
                            id="destination"
                            class="form-control"
                            placeholder="Enter Destination"
                            required
                        >
                    </div>


                    <!-- Pass Type -->
                    <div class="mb-3">
                        <label class="form-label">
                            Pass Type
                        </label>

                        <select
                            id="pass_type"
                            class="form-select"
                        >
                            <option value="Monthly">
                                Monthly
                            </option>

                            <option value="Quarterly">
                                Quarterly
                            </option>
                        </select>
                    </div>


                    <!-- Start Date -->
                    <div class="mb-3">
                        <label class="form-label">
                            Start Date
                        </label>

                        <input
                            type="date"
                            id="start_date"
                            class="form-control"
                            required
                        >
                    </div>


                    <!-- End Date -->
                    <div class="mb-4">
                        <label class="form-label">
                            End Date
                        </label>

                        <input
                            type="date"
                            id="end_date"
                            class="form-control"
                            required
                        >
                    </div>


                    <!-- Apply Button -->
                    <button
                        type="button"
                        class="btn btn-primary w-100 mb-3"
                        onclick="applyBusPass()"
                    >
                        🚌 Apply Bus Pass
                    </button>


                    <!-- Logout Button -->
                    <button
                        type="button"
                        class="btn btn-outline-secondary w-100"
                        onclick="logout()"
                    >
                        Logout
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Student ID Automatic Loading -->
    <script>

        const studentId = localStorage.getItem("studentId");

        if (!studentId) {

            alert("Please login first");

            window.location.href = "login.html";

        } else {

            document.getElementById("student_id").value = studentId;

        }

    </script>


    <!-- Main JavaScript -->
    <script src="script.js"></script>

</body>

</html>
